name: Telvyo quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telvyo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-backend:
    name: Web, backend and hosted Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telvyo_test
          POSTGRES_PASSWORD: telvyo_test
          POSTGRES_DB: telvyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telvyo_test -d telvyo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TELVYO_TEST_DATABASE_URL: postgres://telvyo_test:telvyo_test@127.0.0.1:5432/telvyo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducible dependencies
        run: |
          npm ci
          npm ci --prefix server
      - name: Run test suite
        run: npm test
      - name: Check JavaScript parsing
        run: npm run check
      - name: Validate VPS deploy script
        run: bash -n scripts/deploy-vps.sh
      - name: Build hosted Worker and public assets
        run: npm run build:hosted
      - name: Verify hosted output and asset parity
        run: npm run verify:hosted
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix server --omit=dev --audit-level=high

  android:
    name: Android debug build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install native build dependencies
        run: npm ci --prefix mobile
      - name: Sync checked-in web assets to Android
        working-directory: mobile
        run: npx cap sync android
      - name: Assemble debug, test Java and run Android lint
        working-directory: mobile/android
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Package internal Android QA build
        uses: actions/upload-artifact@v4
        with:
          name: telvyo-android-internal-qa-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
